<!doctype html>
<meta charset="utf-8">
<title>Cleaners Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9fdcff; font: 12px/1.3 ui-monospace, Menlo, monospace; }
  canvas { display: block; }
  #cap { position: fixed; left: 12px; top: 10px; background: #17171b; color: #ffc21a; padding: 6px 9px; font: 800 13px/1 "Arial Black", Impact, sans-serif; letter-spacing: .02em; }
  #cap:empty { display: none; }
  #err { position: fixed; left: 12px; bottom: 10px; color: #ff4fa3; white-space: pre; }
</style>
<div id="cap"></div>
<pre id="err"></pre>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/" } }</script>
<script>
  addEventListener('error', e => { document.getElementById('err').textContent += (e.message || e) + '\n'; document.title = 'error'; });
  addEventListener('unhandledrejection', e => { document.getElementById('err').textContent += 'promise: ' + (e.reason?.stack || e.reason) + '\n'; document.title = 'error'; });
</script>
<script type="module" src="./cleaners.js"></script>
