<!doctype html>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;800&family=VT323&display=swap">
<style>
  :root { --ink: #0a0a0a; --paper: #ffffff; --mute: #6d6d6d; --common: #8e8e94; --rare: #2f5bff; --epic: #8a3cff; --grail: #e7bd4a; }
  html, body { background: var(--paper); }
  body { margin: 0; color: var(--ink); font: 14px/1.45 Archivo, "Helvetica Neue", Arial, sans-serif; }
  .wrap { max-width: 1560px; margin: 0 auto; padding: 14px 16px 48px; }
  .px { font-family: VT323, "Courier New", monospace; font-size: 18px; letter-spacing: .02em; text-transform: uppercase; line-height: 1; }
  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; border-bottom: 6px solid var(--ink); padding-bottom: 8px; }
  .mast { font-family: Anton, Impact, sans-serif; font-size: clamp(56px, 10vw, 150px); line-height: .82; margin: 0; }
  .kick { display: flex; flex-direction: column; gap: 6px; text-align: right; padding-bottom: 6px; }
  .kick b { font-family: Anton, Impact, sans-serif; font-weight: 400; font-size: 26px; line-height: 1; text-transform: uppercase; }
  .legend { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  h2 { font-family: Anton, Impact, sans-serif; font-weight: 400; font-size: clamp(30px, 3.4vw, 46px); line-height: .9; text-transform: uppercase; margin: 0; }
  .sec { padding-top: 26px; display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; border-bottom: 2px solid var(--ink); padding-bottom: 6px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px 14px; padding-top: 12px; }
  .card { display: flex; flex-direction: column; gap: 5px; }
  .shots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3px; }
  .shots canvas { width: 100%; aspect-ratio: 1; display: block; background: #e4e4e4; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .name { font-weight: 800; font-size: 14px; }
  .cw { font-size: 11.5px; color: #333; line-height: 1.3; }
  .cw b { font-weight: 800; }
  .why { font-size: 11.5px; color: #6b5310; line-height: 1.3; }
  .tier { font-family: VT323, monospace; font-size: 16px; text-transform: uppercase; padding: 1px 6px 0; color: #fff; white-space: nowrap; }
  .tier.common { background: var(--common); } .tier.rare { background: var(--rare); } .tier.epic { background: var(--epic); } .tier.grail { background: var(--grail); color: var(--ink); }
  .fits { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 16px 14px; padding-top: 14px; }
  @media (max-width: 1100px) { .fits { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 560px) { .fits { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grid { grid-template-columns: 1fr; } }
  .fit { display: flex; flex-direction: column; gap: 5px; }
  .fit .pics { display: grid; grid-template-columns: 3fr 2fr; gap: 3px; align-items: end; }
  .fit canvas { width: 100%; display: block; }
  .fit .pfp { aspect-ratio: 1; } .fit .body { aspect-ratio: 4 / 5; }
  .fit .handle { font-weight: 800; font-size: 14px; }
  .fit .credits { font-size: 11.5px; color: #333; line-height: 1.35; }
  #err { color: #c00; font: 12px monospace; white-space: pre-wrap; } #err:empty { display: none; }
  #prog { color: var(--mute); }
</style>
<div class="wrap">
  <header>
    <h1 class="mast">DROP 02</h1>
    <div class="kick"><span class="px">AI City · Fit Street · traits pass 2026-09-29</span><b>60 new traits, 12 fits</b>
      <div class="legend" id="legend"></div><span class="px" id="prog">rendering…</span></div>
  </header>
  <div id="err"></div>
  <div class="sec"><h2>The fits</h2><span class="px">three per tier · new + approved pieces · pfp framing from the fit check</span></div>
  <div class="fits" id="fits"></div>
  <div id="slots"></div>
</div>

<script>window.addEventListener('error', e => { const el = document.getElementById('err'); if (el) el.textContent += (e.message || e) + '\n'; });</script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { build, dispose, look, NAMES, NEWI, TIER_ORDER, newTraitList, credits } from '../../../world/chars.js';
import { FITS } from './fits.js';

// the fit check's studio: seamless sweep, direct flash, one renderer drawn into many canvases
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); renderer.setPixelRatio(1); renderer.setSize(1024, 1024, false);
renderer.toneMapping = THREE.NeutralToneMapping; renderer.toneMappingExposure = 1.05; renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFShadowMap; renderer.autoClear = false;
const scene = new THREE.Scene(); const pmrem = new THREE.PMREMGenerator(renderer); scene.environment = pmrem.fromScene(new RoomEnvironment(), .04).texture; scene.environmentIntensity = .45;
const sweepMat = new THREE.MeshStandardMaterial({ color: 0xe4e4e4, roughness: .95 });
{ const prof = []; for (let z = 8; z > -0.8; z -= .4) prof.push([z, 0]); for (let a = 0; a <= 90; a += 6) { const r = .9, t = THREE.MathUtils.degToRad(a); prof.push([-0.8 - r * Math.sin(t), r - r * Math.cos(t)]); } for (let y = 1.2; y < 9; y += .6) prof.push([-1.7, y]);
  const pos = [], idx = []; prof.forEach(([z, y], i) => { pos.push(-12, y, z, 12, y, z); if (i) { const a = (i - 1) * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); } });
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals();
  const sweep = new THREE.Mesh(g, sweepMat); sweep.receiveShadow = true; scene.add(sweep); }
scene.add(new THREE.HemisphereLight(0xffffff, 0x999999, .7));
const flash = new THREE.DirectionalLight(0xffffff, 2.7); flash.castShadow = true; flash.shadow.mapSize.set(2048, 2048); flash.shadow.bias = -0.0005; flash.shadow.normalBias = .01;
Object.assign(flash.shadow.camera, { left: -2.5, right: 2.5, top: 3, bottom: -1, near: .5, far: 20 }); scene.add(flash, flash.target); flash.target.position.set(0, 1, 0);
const cam = (pos, at, fov = 24, aspect = 1) => { const c = new THREE.PerspectiveCamera(fov, aspect, .1, 50); c.position.set(...pos); c.lookAt(...at); return c; };
const CAM = {   // per slot: a framing that fills the tile with the piece (bust + full = the fit check's own pfp and full-body framing)
  bust: cam([.4, 1.5, 3.2], [0, 1.4, 0]), full: cam([.55, 1.32, 5.6], [0, 1.03, 0], 26, 4 / 5),
  head: cam([.55, 1.6, 3.95], [0, 1.45, 0]), mouth: cam([.3, 1.2, 2.37], [0, 1.12, 0]), earL: cam([-2.1, 1.3, 1.55], [0, 1.22, 0]),
  chest: cam([.3, .98, 2.0], [0, .76, 0]), upper: cam([.5, .98, 3.2], [0, .72, 0]), hands: cam([.35, .72, 2.6], [0, .56, 0]), held: cam([.7, .64, 3.1], [.15, .46, 0]),
  legs: cam([.75, .52, 2.5], [0, .3, 0]), feet: cam([1.25, .45, 1.8], [0, .2, 0], 20) };
const VIEW = { mouth: ['mouth', .22], ears: ['earL', 0], hat: ['head', .42], hair: ['head', .55], eyewear: ['head', .3], neck: ['chest', .3], top: ['upper', .42], acc: ['hands', 0], held: ['held', -.45], bottom: ['legs', .42], shoes: ['feet', .5] };
function shoot(obj, bg, c, w, h, ctx) {
  sweepMat.color.set(bg); flash.position.copy(c.position).add(new THREE.Vector3(-1.5, 1.3, .2));
  renderer.setViewport(0, 0, w, h); renderer.setScissor(0, 0, w, h); renderer.setScissorTest(true); renderer.clear(); renderer.render(scene, c);
  ctx.drawImage(renderer.domElement, 0, 1024 - h, w, h, 0, 0, ctx.canvas.width, ctx.canvas.height); }
function snap(L, bg, c, ry, w, h, ctx) { const o = build(L); o.rotation.y = ry; scene.add(o); shoot(o, bg, c, w, h, ctx); scene.remove(o); dispose(o); }

// three base characters (approved pieces) that every new trait is tried on, in colourways 0 · 1 · 2
const BASES = [
  look({ skin: 'deep', hair: { id: 'buzz', c: 0x2a1c14 }, eyes: 'bored', mouth: 'flat', top: { id: 'tee', c: 0xf2f2f2, print: 'star' }, bottom: { id: 'baggy', c: 0x2b3f66 }, shoes: { id: 'dad' } }),
  look({ skin: 'pale', hair: { id: 'long', c: 0x151214 }, eyes: 'side', mouth: 'smirk', top: { id: 'hoodie', c: 0x151517, logo: 'small' }, bottom: { id: 'cargo', c: 0x2a2a2c }, shoes: { id: 'foam', c: 0x151517 } }),
  look({ skin: 'terracotta', hair: { id: 'afro' }, eyes: 'mean', mouth: 'flat', top: { id: 'tank' }, bottom: { id: 'sweats' }, shoes: { id: 'slides' } }),
];
const wear = (base, e, cw) => { const L = structuredClone(base); if (e.slot === 'mouth') L.mouth = e.id; else L[e.slot] = { id: e.id, cw }; if (e.slot === 'hair') L.hat = { id: 'none' };
  if (e.slot === 'eyewear' || e.slot === 'mouth') L.hair = L.hair.id === 'long' ? { id: 'buzz', c: 0x151214 } : L.hair; return L; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const badge = t => `<span class="tier ${t}">${t}</span>`;
const count = {}; for (const e of newTraitList()) count[e.tier] = (count[e.tier] || 0) + 1;
document.getElementById('legend').innerHTML = TIER_ORDER.map(t => `${badge(t)}<span class="px">${count[t] || 0}</span>`).join(' ');

const jobs = [];
// the fits: pfp (bust framing) + full body
const fitsEl = document.getElementById('fits');
for (const { tier, L } of FITS) {
  const d = document.createElement('div'); d.className = 'fit';
  const cws = ['hair', 'hat', 'eyewear', 'ears', 'top', 'neck', 'bottom', 'shoes', 'held', 'acc'].filter(s => L[s] && NEWI[L[s].id]).map(s => NEWI[L[s].id].cw ? NEWI[L[s].id].cw[L[s].cw | 0][0] + ' ' + NEWI[L[s].id].name : NEWI[L[s].id].name);
  d.innerHTML = `<div class="pics"><canvas class="pfp" width="360" height="360"></canvas><canvas class="body" width="240" height="300"></canvas></div>
    <div class="row"><span class="handle">${esc(L.handle)}</span>${badge(tier)}</div><div class="credits">${esc(NAMES.skin[L.skin])} · ${esc(credits(L))}</div>`;
  fitsEl.appendChild(d); const [a, b] = d.querySelectorAll('canvas');
  jobs.push(() => snap(L, L.bg, CAM.bust, .42, 256, 256, a.getContext('2d'))); jobs.push(() => snap(L, L.bg, CAM.full, .42, 512, 640, b.getContext('2d'))); }
// the traits, by slot, commons first
const ORDER = [['mouth', 'Grillz'], ['neck', 'Chains + pieces'], ['ears', 'Ears'], ['acc', 'Wrist, hands + bags'], ['top', 'Tops'], ['bottom', 'Bottoms'], ['shoes', 'Shoes'], ['hat', 'Hats'], ['hair', 'Hair'], ['eyewear', 'Eyewear'], ['held', 'Held']];
const slotsEl = document.getElementById('slots');
for (const [slot, title] of ORDER) {
  const list = newTraitList().filter(e => e.slot === slot).sort((a, b) => TIER_ORDER.indexOf(a.tier) - TIER_ORDER.indexOf(b.tier));
  const sec = document.createElement('div'); sec.innerHTML = `<div class="sec"><h2>${title}</h2><span class="px">${list.length} new · slot ${slot}</span></div><div class="grid"></div>`; slotsEl.appendChild(sec);
  const grid = sec.querySelector('.grid');
  for (const e of list) { const n = e.cw ? e.cw.length : 1, card = document.createElement('div'); card.className = 'card';
    const cwTxt = e.cw ? e.cw.map((c, i) => i < 3 ? `<b>${esc(c[0])}</b>` : esc(c[0])).join(' · ') : 'one colourway';
    card.innerHTML = `<div class="shots"><canvas width="300" height="300"></canvas><canvas width="300" height="300"></canvas><canvas width="300" height="300"></canvas></div>
      <div class="row"><span class="name">${esc(e.name)}</span>${badge(e.tier)}</div><div class="cw"><span class="px" style="font-size:14px">${e.id}</span> · ${cwTxt}</div>${e.why ? `<div class="why">${esc(e.why)}</div>` : ''}`;
    grid.appendChild(card); const cvs = card.querySelectorAll('canvas'), [cn, ry] = VIEW[slot];
    BASES.forEach((B, i) => jobs.push(() => snap(wear(B, e, i % n), '#e4e4e4', CAM[cn], ry, 256, 256, cvs[i].getContext('2d')))); } }
// render: a few tiles per tick; title "ready" when done (headless shots wait on it)
const total = jobs.length, prog = document.getElementById('prog'); let done = 0;
function tick() { const t0 = performance.now(); while (jobs.length && performance.now() - t0 < 40) { try { jobs.shift()(); } catch (err) { document.getElementById('err').textContent += err.stack + '\n'; } done++; }
  prog.textContent = `rendered ${done} / ${total}`; if (jobs.length) setTimeout(tick, 0); else { prog.textContent = `${total} renders · ${newTraitList().length} traits`; document.title = 'ready'; } }
setTimeout(tick, 0);
</script>
