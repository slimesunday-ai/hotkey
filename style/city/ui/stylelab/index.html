<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UI Style Lab</title>
<!-- UI STYLE LAB (2026-10-07) · one basic menu (the bar + a compact agent card) in many UI styles over a real city still, for slime to
     curate keep / kill / maybe. Picks save to ./picks.json (POST /api/stylelab, style/serve.mjs) with a localStorage copy.
     URL: ?round=1|2 · ?style=<id> opens one full size · ?bg=street|night|calm · ?shot=<id> just the 1280 x 720 stage (headless shots) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&family=VT323&family=Courier+Prime:wght@400;700&family=Anton&family=Rubik+Dirt&family=Silkscreen:wght@400;700&family=Press+Start+2P&family=Pixelify+Sans:wght@400;600&family=DotGothic16&family=Space+Mono:wght@400;700&family=Inter+Tight:wght@400;600;800;900&family=Tinos:ital,wght@0,400;0,700;1,400&family=Libre+Franklin:ital,wght@0,500;0,800;0,900;1,800&family=Special+Elite&family=Share+Tech+Mono&family=Orbitron:wght@500;700;900&family=Exo+2:wght@300;400;600&family=Bangers&family=Oswald:wght@400;600;700&family=Nunito:wght@600;800;900&family=Comic+Neue:wght@400;700&family=Permanent+Marker&family=Rubik+Mono+One&family=Bungee&family=Sedgwick+Ave+Display&family=Allerta+Stencil&family=Chakra+Petch:wght@400;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&family=Open+Sans:wght@300;400;600&family=Varela+Round&family=Arimo:wght@400;700&display=swap">
<link rel="stylesheet" href="./lab.css">
<link rel="stylesheet" href="./mock.css">
<link rel="stylesheet" href="./styles.css">
<link rel="stylesheet" href="./styles-r2.css">
</head>
<body>
<header class="top">
  <div class="ttl"><b>UI style lab</b><span>one menu, many styles · AI City</span></div>
  <nav class="chips rounds" id="rounds" aria-label="Round"></nav>
  <nav class="chips" id="filters" aria-label="Show"></nav>
  <div class="opts">
    <div class="seg" id="bgs" aria-label="Backdrop"><span>backdrop</span><button data-bg="street">street</button><button data-bg="night">night</button><button data-bg="calm">calm</button></div>
    <div class="seg" id="sizes" aria-label="Card size"><span>size</span><button data-size="s">S</button><button data-size="m">M</button><button data-size="l">L</button></div>
  </div>
  <div class="save" id="save">…</div>
</header>
<p class="help">Click a card to see it full size. <kbd>K</kbd> keep · <kbd>M</kbd> maybe · <kbd>X</kbd> kill · <kbd>U</kbd> undecided (on the focused card or in the full view) · <kbd>←</kbd><kbd>→</kbd> next style · <kbd>Esc</kbd> back. Killed styles hide from “all”.</p>
<main class="grid" id="grid"></main>
<div class="view" id="view" hidden>
  <div class="vstage" id="vstage"></div>
  <div class="vbar">
    <button class="nav" id="vprev" title="Previous (←)">←</button>
    <div class="vmeta"><div class="vname"><b id="vname"></b><em id="vtag"></em><span id="vpos"></span></div><p id="vline"></p></div>
    <div class="decide" id="vdecide"></div>
    <textarea id="vnote" rows="2" maxlength="1000" placeholder="note for this style…"></textarea>
    <button class="nav" id="vnext" title="Next (→)">→</button>
    <button class="nav close" id="vclose" title="Back to the grid (Esc)">✕</button>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<script type="module" src="./lab.js"></script>
</body>
</html>
