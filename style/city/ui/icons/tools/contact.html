<!doctype html>
<meta charset="utf-8">
<title>AI City · item icons</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The contact sheet of the baked set, drawn by the runtime module (icons.js) from the atlas: ?bg=light|dark&px=64|32 -->
<style>
  :root { --bg: #e9e4d8; --card: #f6f3ec; --ink: #17171b; --ink2: #5a554b; --line: rgba(23, 23, 27, .14); }
  :root[data-bg="dark"] { --bg: #0d0f12; --card: #191c21; --ink: #f3f3ea; --ink2: #9a9d92; --line: rgba(243, 243, 234, .14); }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 12px/1.3 "Helvetica Neue", Arial, sans-serif; }
  main { padding: 22px 26px 28px; width: max-content; }
  h1 { font: 800 20px/1 "Arial Black", Impact, sans-serif; text-transform: uppercase; letter-spacing: .02em; margin: 0 0 4px; }
  .sub { color: var(--ink2); margin-bottom: 16px; }
  h2 { font: 700 11px/1 ui-monospace, Menlo, monospace; text-transform: uppercase; letter-spacing: .08em; color: var(--ink2); margin: 16px 0 8px; }
  #sheet { display: flex; flex-wrap: wrap; gap: 4px 22px; width: calc(12 * var(--w) + 11 * 8px); }
  section { display: flex; flex-direction: column; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; max-width: calc(12 * var(--w) + 11 * 8px); }
  .c { width: var(--w); box-sizing: border-box; }
  .c { background: var(--card); border-radius: 6px; box-shadow: inset 0 0 0 1px var(--line); padding: 8px 4px 6px; display: flex; flex-direction: column; align-items: center; gap: 5px; min-height: calc(var(--px) + 36px); }
  .c b { font: 700 10.5px/1.1 ui-monospace, Menlo, monospace; text-align: center; word-break: break-all; }
  .c span.n { font-size: 10px; color: var(--ink2); text-align: center; line-height: 1.15; }
</style>
<main><h1>AI City · item icons</h1><div class="sub" id="sub"></div><div id="sheet"></div></main>
<script type="module">
  import { iconFor, ready } from '../icons.js';
  const Q = new URLSearchParams(location.search), px = +(Q.get('px') || 64), bg = Q.get('bg') || 'light';
  document.documentElement.dataset.bg = bg; document.documentElement.style.setProperty('--px', px + 'px'); document.documentElement.style.setProperty('--w', Math.max(px + 30, 92) + 'px');
  const A = await ready, by = {};
  for (const [k, e] of Object.entries(A.icons)) (by[e.group] ||= []).push([k, e]);
  const NAMES = { cash: 'cash', ingredient: 'ingredients (dug)', part: 'scrap parts (the Heap)', product: 'product (cooked)', crafted: 'crafted', tool: 'tools', gear: 'home gear', security: 'home security', mark: 'marks (trophies)', trait: 'worn traits (Fit Street)', fallback: 'fallback' };
  const sheet = document.getElementById('sheet');
  for (const g of A.groups) { const L = by[g]; if (!L) continue; const sec = document.createElement('section'), h = document.createElement('h2'); h.textContent = `${NAMES[g] || g} · ${L.length}`; sec.append(h); sheet.append(sec);
    const row = document.createElement('div'); row.className = 'row'; sec.append(row);
    for (const [k, e] of L.sort((a, b) => a[1].i - b[1].i)) { const c = document.createElement('div'); c.className = 'c'; c.append(iconFor(k, { size: px }));
      const b = document.createElement('b'); b.textContent = k; const n = document.createElement('span'); n.className = 'n'; n.textContent = e.name + (e.tier ? ' · ' + e.tier : ''); c.append(b, n); row.append(c); } }
  document.getElementById('sub').textContent = `${A.count} icons · shown at ${px} px on ${bg} · baked ${A.cell} px (1×) and ${A.cell * 2} px (2×) cells · ${A.view.azimuth}° / ${A.view.elevation}° view · ink outline`;
  await document.fonts?.ready; await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
  await Promise.all([...document.querySelectorAll('.k-ico')].slice(0, 1).map(() => new Promise(r => { const im = new Image(); im.onload = im.onerror = r; im.src = new URL('../atlas/icons@2x.png', import.meta.url).href; })));
  document.title = 'sheet-ready';
</script>
